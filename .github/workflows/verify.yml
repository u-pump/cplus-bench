name: Verify submitted patches

on:
  push:
    branches:
      - main
    paths:
      - 'cases/**'
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Case ID (blank means all cases)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'u-pump'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BEFORE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      SELECT_CASE: ${{ inputs.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect submitted patches
        id: patches
        run: echo "has_patch=$(python scripts/verify_cases.py --has-patches)" >> "$GITHUB_OUTPUT"
      - name: Install private verifier
        if: steps.patches.outputs.has_patch == 'true'
        env:
          CPLUS_READ_TOKEN: ${{ secrets.CPLUS_READ_TOKEN }}
        run: bash scripts/install_private.sh
      - name: Verify cases
        env:
          CPLUS_DATA_DIR: ${{ runner.temp }}/cplus-data
        run: python scripts/verify_cases.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-results
          path: results/*.md
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.actor == 'u-pump'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-results
          path: results
      - name: Commit generated summaries
        env:
          RESULTS_TOKEN: ${{ github.token }}
        run: bash scripts/commit_results.sh
